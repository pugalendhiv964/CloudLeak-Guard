name: CloudLeak Guard checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install streamlit
      - name: Run custom rule tests
        run: python -m unittest discover -s tests -v
      - name: Validate safe Terraform sample with Checkov
        run: |
          python -m pip install checkov
          checkov -d samples/safe --framework terraform --quiet
