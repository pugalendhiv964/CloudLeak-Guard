name: CloudLeak Guard checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile app.py scanner.py report_generator.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check risky sample if present
        shell: bash
        run: |
          if [ -d samples/risky ]; then
            checkov -d samples/risky --framework terraform --quiet --soft-fail
          fi
